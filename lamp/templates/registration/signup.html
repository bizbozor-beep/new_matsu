<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% load static %}
    <title>Ro'yxatdan o'tish | Roblox Tournament</title>
    
    <!-- Google Fonts: Orbitron & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Maxsus CSS faylingiz botiqligi saqlab qolindi -->
    <link rel="stylesheet" href="{% static 'lamp/styles.css' %}?v=3">

    <style>
        /* ==========================================================
           1. CSS VARIABLES & BASE STYLES
           ========================================================== */
        :root {
            --bg-dark: #070a14;
            --card-bg: rgba(13, 20, 38, 0.78);
            --border-color: rgba(0, 240, 255, 0.2);
            --border-glow: rgba(0, 240, 255, 0.5);
            
            --primary: #00f0ff;
            --primary-hover: #00b8d4;
            --accent-purple: #8a2be2;
            --accent-red: #ff4655;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --font-heading: 'Orbitron', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* ==========================================================
           2. ANIMATED CYBER BACKGROUND
           ========================================================== */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            z-index: -1;
            opacity: 0.45;
            animation: pulseGlow 10s infinite alternate ease-in-out;
        }

        .glow-orb-1 {
            width: 450px;
            height: 450px;
            background: var(--accent-purple);
            top: -100px;
            right: -100px;
        }

        .glow-orb-2 {
            width: 450px;
            height: 450px;
            background: var(--primary);
            bottom: -120px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
            100% { transform: scale(1.18) translate(-20px, 20px); opacity: 0.55; }
        }

        /* ==========================================================
           3. CONTAINER & GLASSMORPHISM CARD
           ========================================================== */
        .page-shell {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .registration-card {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75),
                        0 0 30px rgba(0, 240, 255, 0.12);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .registration-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-purple), var(--primary), var(--accent-red));
        }

        /* ==========================================================
           4. BRANDING & HEADER
           ========================================================== */
        .brand {
            display: block;
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .brand span {
            color: var(--primary);
            text-shadow: 0 0 18px rgba(0, 240, 255, 0.6);
        }

        .eyebrow {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 1.85rem;
            font-weight: 800;
            text-align: center;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .card-description {
            font-size: 0.92rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* ==========================================================
           5. FORM & DJANGO form.as_p CUSTOM STYLING
           ========================================================== */
        .registration-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .registration-form p {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
            position: relative;
        }

        .registration-form label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .registration-form input[type="text"],
        .registration-form input[type="password"],
        .registration-form input[type="email"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(8, 13, 26, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .registration-form input:focus {
            border-color: var(--primary);
            background: rgba(8, 13, 26, 0.95);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.25);
        }

        /* Django Help Text & Error list styling */
        .helptext {
            font-size: 0.76rem;
            color: var(--text-muted);
            line-height: 1.3;
            margin-top: 2px;
        }

        .errorlist {
            list-style: none;
            color: var(--accent-red);
            font-size: 0.82rem;
            margin-top: 4px;
            padding-left: 0;
            font-weight: 600;
        }

        /* ==========================================================
           6. BUTTONS & ACTIONS
           ========================================================== */
        .button-primary {
            margin-top: 10px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, #0088ff 100%);
            color: #030814;
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 22px rgba(0, 240, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 240, 255, 0.55);
            background: linear-gradient(135deg, #33f3ff 0%, #0099ff 100%);
        }

        .button-primary:active {
            transform: translateY(0);
        }

        /* ==========================================================
           7. FOOTER LINKS
           ========================================================== */
        .auth-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .auth-link a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .registration-card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Dynamic Cyber Background Effects -->
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <main class="page-shell auth-shell">
        <section class="registration-card">
            <!-- Brand Logo -->
            <a class="brand" href="{% url 'signup' %}">
                ROBLOX <span>TOURNAMENT</span>
            </a>

            <!-- Header Section -->
            <p class="eyebrow">YANGI AKKAUNT</p>
            <h1>Ro'yxatdan o'tish</h1>
            <p class="card-description">Saytdan foydalanish uchun akkaunt yarating.</p>

            <!-- Django Registration Form -->
            <form method="post" class="registration-form">
                {% csrf_token %}
                
                <!-- Django form.as_p renderni qamrab oladi -->
                {{ form.as_p }}

                <!-- Action Button -->
                <button class="button button-primary" type="submit">
                    Akkaunt yaratish <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

            <!-- Navigation Link -->
            <p class="auth-link">
                Akkauntingiz bormi? <a href="{% url 'login' %}">Kirish</a>
            </p>
        </section>
    </main>
</body>
</html>
